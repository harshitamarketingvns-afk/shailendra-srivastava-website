<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Book cover placeholder — cover coming soon">
  <!-- Background -->
  <rect width="600" height="800" fill="#0e0e0f"/>

  <!-- Subtle paper grain texture -->
  <rect width="600" height="800" fill="#0e0e0f" opacity="0.5"/>

  <!-- Decorative gold frame (double, matching site design) -->
  <rect x="24" y="24" width="552" height="752" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.5"/>
  <rect x="32" y="32" width="536" height="736" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.25"/>

  <!-- Top: brand wordmark -->
  <text x="300" y="100" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#c9a96e" letter-spacing="5" font-weight="500">SHAILENDRA SRIVASTAVA</text>
  <line x1="255" y1="120" x2="345" y2="120" stroke="#c9a96e" stroke-width="0.5" opacity="0.4"/>
  <text x="300" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9b958a" letter-spacing="3">AUTHOR &#8226; RESEARCHER</text>
  <text x="300" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9b958a" letter-spacing="2.5">DIAMOND &#8226; GEMSTONE PROFESSIONAL</text>

  <!-- Central monogram: S inside concentric circles -->
  <g transform="translate(300, 380)">
    <circle r="58" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.5"/>
    <circle r="50" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.25"/>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#c9a96e" opacity="0.85" font-weight="700">S</text>
  </g>

  <!-- Label -->
  <text x="300" y="510" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#c9a96e" opacity="0.9" font-style="italic">Cover Coming Soon</text>
  <text x="300" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b6358" letter-spacing="2.5">PLACEHOLDER &#8226; NOT THE FINAL COVER</text>

  <!-- Bottom decorative line -->
  <line x1="255" y1="690" x2="345" y2="690" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>

  <!-- Bottom: imprint -->
  <text x="300" y="720" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9b958a" letter-spacing="2" opacity="0.6">PREMIUM AUTHOR EDITION</text>
</svg>
